<!-- ShadowX13413 — Mobile UI/UX Enhancement -->
<style id="shadowx-mobile-ui">
  :root {
    --sx-cyan: #00ffcc;
    --sx-panel: rgba(10, 12, 18, .94);
    --sx-border: rgba(0, 255, 204, .24);
  }

  html, body {
    width: 100%;
    min-height: 100%;
    margin: 0;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent;
  }

  #canvas {
    position: fixed;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
  }

  #hud {
    z-index: 10;
    box-sizing: border-box;
    max-width: calc(100vw - 24px);
    max-height: calc(100vh - 24px);
    max-height: calc(100dvh - 24px);
    overflow: hidden;
    background: var(--sx-panel);
    border: 1px solid var(--sx-border);
    box-shadow: 0 12px 40px rgba(0,0,0,.45),
                0 0 24px rgba(0,255,204,.06);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }

  #hud-header {
    min-height: 34px;
    touch-action: pan-y;
    user-select: none;
    -webkit-user-select: none;
  }

  #minimize-btn {
    min-width: 40px;
    min-height: 40px;
    border-radius: 10px;
    color: var(--sx-cyan);
  }

  #hud-body {
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: rgba(0,255,204,.35) transparent;
    -webkit-overflow-scrolling: touch;
  }

  button, input, .swatch { touch-action: manipulation; }

  button {
    min-height: 40px;
    border-radius: 9px;
  }

  input[type="range"] {
    min-height: 30px;
    cursor: pointer;
    accent-color: var(--sx-cyan);
  }

  input[type="range"]::-webkit-slider-thumb {
    width: 19px;
    height: 19px;
  }

  .swatch { min-height: 34px; border-radius: 8px; }

  button:focus-visible, input:focus-visible {
    outline: 2px solid var(--sx-cyan);
    outline-offset: 3px;
  }

  @media (max-width: 600px) {
    #hud {
      position: fixed !important;
      top: max(10px, env(safe-area-inset-top)) !important;
      left: 10px !important;
      right: auto !important;
      width: min(340px, calc(100vw - 20px));
      max-width: calc(100vw - 20px);
      max-height: calc(100vh - 20px);
      max-height: calc(100dvh - 20px - env(safe-area-inset-top)
                       - env(safe-area-inset-bottom));
      padding: 14px;
      border-radius: 18px;
    }

    #hud-header {
      gap: 10px;
      padding-bottom: 10px;
      margin-bottom: 10px;
      cursor: default;
    }

    #hud-header h1 {
      gap: 6px;
      font-size: 1rem;
      letter-spacing: 1.5px;
    }

    #hud-body {
      max-height: calc(100dvh - 110px);
      padding-bottom: 5px;
    }

    .stat-row { font-size: .78rem; margin-bottom: 8px; }

    .control-group {
      margin-top: 12px;
      padding-top: 11px;
    }

    label { gap: 8px; font-size: .72rem; line-height: 1.5; }

    .btn-group {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
      margin-top: 10px;
    }

    .btn-group button {
      min-width: 0;
      min-height: 42px;
      padding: 8px 3px;
      font-size: .66rem;
      letter-spacing: .3px;
    }

    .swatch-group { gap: 7px; }

    .guide {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,.08);
      font-size: .68rem;
      line-height: 1.8;
    }

    #hud.minimized {
      width: auto;
      max-width: calc(100vw - 20px);
      padding: 10px 12px;
    }

    #hud.minimized #hud-header { margin: 0; padding: 0; }
    #hud.minimized #hud-header h1 { font-size: .85rem; }
    #hud.minimized #minimize-btn { min-width: 36px; min-height: 36px; }
  }

  @media (max-width: 380px) {
    #hud { padding: 11px; }
    #hud-header h1 { font-size: .9rem; letter-spacing: 1px; }
    .btn-group { gap: 5px; }
    .btn-group button { font-size: .61rem; }
  }

  @media (max-height: 500px) and (max-width: 900px) {
    #hud { max-height: calc(100dvh - 16px); top: 8px !important; }
    #hud-body { max-height: calc(100dvh - 90px); }
  }

  @media (prefers-reduced-motion: reduce) {
    #hud, #hud-body, button, .swatch {
      transition-duration: .01ms !important;
    }
  }
</style>

<script id="shadowx-mobile-input">
(() => {
  if (window.__shadowXMobilePatchInstalled) return;
  window.__shadowXMobilePatchInstalled = true;

  const canvas = document.getElementById('canvas');
  const hud = document.getElementById('hud');
  const header = document.getElementById('hud-header');
  const minimize = document.getElementById('minimize-btn');
  if (!canvas || !hud || !header) return;

  const activeTouches = new Map();
  let lastTap = { time: 0, x: 0, y: 0 };
  let dragging = null;

  function updateInteraction(event) {
    if (typeof mouse === 'undefined') return;
    mouse.x = event.clientX;
    mouse.y = event.clientY;
    mouse.active = true;
    if (typeof lastInteraction !== 'undefined') {
      lastInteraction = performance.now();
    }
  }

  function triggerShockwave(x, y) {
    if (typeof particles === 'undefined') return;
    particles.forEach(p => {
      const dx = p.x - x;
      const dy = p.y - y;
      const distance = Math.hypot(dx, dy) || 1;
      p.vx += dx / distance * 18;
      p.vy += dy / distance * 18;
      p.hue = 50;
    });
  }

  canvas.addEventListener('pointerdown', event => {
    if (event.pointerType === 'mouse' || event.target.closest('#hud')) return;
    event.preventDefault();
    updateInteraction(event);
    activeTouches.set(event.pointerId, { x: event.clientX, y: event.clientY });

    if (typeof mouse !== 'undefined') {
      if (activeTouches.size === 1) {
        mouse.leftDown = true;
        mouse.rightDown = false;
        mouse.type = 'attract';
        const now = performance.now();
        const dx = event.clientX - lastTap.x;
        const dy = event.clientY - lastTap.y;
        if (now - lastTap.time < 320 && dx * dx + dy * dy < 900) {
          triggerShockwave(event.clientX, event.clientY);
          lastTap.time = 0;
        } else {
          lastTap = { time: now, x: event.clientX, y: event.clientY };
        }
      } else {
        mouse.rightDown = true;
        mouse.type = 'repel';
      }
    }

    try { canvas.setPointerCapture(event.pointerId); } catch (_) {}
  }, { passive: false });

  canvas.addEventListener('pointermove', event => {
    if (event.pointerType === 'mouse' || !activeTouches.has(event.pointerId)) return;
    event.preventDefault();
    updateInteraction(event);
    activeTouches.set(event.pointerId, { x: event.clientX, y: event.clientY });
  }, { passive: false });

  function endTouch(event) {
    if (event.pointerType === 'mouse' || !activeTouches.has(event.pointerId)) return;
    activeTouches.delete(event.pointerId);
    if (typeof mouse === 'undefined') return;

    if (!activeTouches.size) {
      mouse.leftDown = false;
      mouse.rightDown = false;
      mouse.active = false;
    } else {
      const point = activeTouches.values().next().value;
      mouse.x = point.x;
      mouse.y = point.y;
      mouse.leftDown = true;
      mouse.rightDown = false;
      mouse.type = 'attract';
    }
  }

  canvas.addEventListener('pointerup', endTouch);
  canvas.addEventListener('pointercancel', endTouch);
  canvas.addEventListener('lostpointercapture', endTouch);
  canvas.addEventListener('contextmenu', event => event.preventDefault());

  header.addEventListener('pointerdown', event => {
    if (event.pointerType === 'mouse' ||
        event.target === minimize ||
        event.target.closest('button')) return;

    event.preventDefault();
    const rect = hud.getBoundingClientRect();
    dragging = {
      id: event.pointerId,
      dx: event.clientX - rect.left,
      dy: event.clientY - rect.top
    };
    hud.style.left = rect.left + 'px';
    hud.style.top = rect.top + 'px';
    hud.style.right = 'auto';
    hud.classList.add('dragging');
    try { header.setPointerCapture(event.pointerId); } catch (_) {}
  });

  header.addEventListener('pointermove', event => {
    if (!dragging || dragging.id !== event.pointerId) return;
    event.preventDefault();
    const maxX = Math.max(0, innerWidth - hud.offsetWidth);
    const maxY = Math.max(0, innerHeight - hud.offsetHeight);
    hud.style.left = Math.max(0, Math.min(maxX, event.clientX - dragging.dx)) + 'px';
    hud.style.top = Math.max(0, Math.min(maxY, event.clientY - dragging.dy)) + 'px';
  });

  function stopDragging(event) {
    if (!dragging || dragging.id !== event.pointerId) return;
    dragging = null;
    hud.classList.remove('dragging');
  }

  header.addEventListener('pointerup', stopDragging);
  header.addEventListener('pointercancel', stopDragging);
  header.addEventListener('lostpointercapture', stopDragging);

  window.addEventListener('resize', () => {
    if (!matchMedia('(max-width: 600px)').matches) return;
    const rect = hud.getBoundingClientRect();
    hud.style.left = Math.max(0, Math.min(innerWidth - hud.offsetWidth, rect.left)) + 'px';
    hud.style.top = Math.max(0, Math.min(innerHeight - hud.offsetHeight, rect.top)) + 'px';
  }, { passive: true });
})();
</script>
